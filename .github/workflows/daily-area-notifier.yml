name: Daily Area Notifier

on:
  schedule:
    # 毎日 08:00 JST (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: 'true にすると notify_time に関係なく即時テスト通知します'
        required: false
        default: 'false'
        type: string

concurrency:
  group: daily-area-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Send Discord notifications
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAILY_NOTIFY: 'true'
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: python daily_area_notifier.py

      - name: Commit notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain area_notify_state.json)" ]; then
            git add area_notify_state.json
            git commit -m "Update area notification state [skip ci]"
            git push
          else
            echo "No notification state changes"
          fi
